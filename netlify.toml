[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Tautan gambar lama (/public/xxx) tetap hidup, misalnya og:image yang sudah tersimpan di WhatsApp.
[[redirects]]
  from = "/public/*"
  to = "/:splat"
  status = 200

# Berkas ber-hash dari Vite boleh di-cache selamanya.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache gambar statis di public/ selama 7 hari untuk percepat kunjungan ulang.
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Header security sebelumnya ada di .htaccess (Apache), tapi Netlify mengabaikan file Apache.
# Netlify sudah otomatis: Brotli/gzip compression dan redirect HTTP->HTTPS.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
